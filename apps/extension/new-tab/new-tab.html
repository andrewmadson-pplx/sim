<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Sim Home</title>
    <link rel="stylesheet" href="new-tab.css" />
    <script src="new-tab.js" defer></script>
  </head>
  <body>
    <main>
      <iframe title="Sim Home" data-src="https://www.sim.ai/extension/new-tab" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe>
      <p id="offline" role="status" hidden>You're offline. Sim Home will reconnect when you're back online.</p>
    </main>
    <footer>
      <a href="https://www.sim.ai/home" referrerpolicy="no-referrer">Open Sim Home</a>
      <button type="button" id="restore">Restore previous new tab</button>
    </footer>
  </body>
</html>
